<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MUTINY — playtest prototype</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1f2630; --line:#30363d;
    --ink:#e6edf3; --dim:#9da7b3; --green:#2ea043; --green2:#196c2e;
    --red:#e5484d; --red2:#992e33; --gold:#e3b341; --blue:#388bfd;
    --tap:64px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    font-size:17px; line-height:1.35;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column}
  h1,h2,h3{margin:0 0 .4em}
  h1{font-size:1.9rem; letter-spacing:.06em}
  .muted{color:var(--dim)}
  .center{text-align:center}
  button{font-family:inherit; font-size:1rem; color:var(--ink); cursor:pointer}
  .btn{
    display:block; width:100%; min-height:var(--tap); padding:14px 16px; margin:8px 0;
    border:1px solid var(--line); border-radius:12px; background:var(--panel2);
    font-size:1.15rem; font-weight:700; letter-spacing:.03em;
  }
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.38; cursor:not-allowed}
  .btn.primary{background:var(--green2); border-color:var(--green)}
  .btn.danger{background:var(--red2); border-color:var(--red)}
  .btn.gold{background:#5a4710; border-color:var(--gold); color:#ffe9a8}
  .btn.ghost{background:transparent}
  .btn.sm{min-height:48px; font-size:1rem; padding:10px 12px; margin:6px 0}
  .row{display:flex; gap:8px; align-items:center}
  .grow{flex:1}
  .wrap{padding:16px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0}

  /* top bar */
  .topbar{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 14px 12px}
  .topline{display:flex; align-items:baseline; gap:10px}
  .legname{font-size:1.15rem; font-weight:800; letter-spacing:.04em}
  .legno{color:var(--dim); font-size:.85rem; font-weight:700}
  .stats{margin-left:auto; display:flex; gap:14px; align-items:center}
  .stat{text-align:right; line-height:1}
  .stat b{font-size:1.25rem; display:block}
  .stat span{font-size:.62rem; color:var(--dim); letter-spacing:.08em; text-transform:uppercase}
  .progwrap{margin-top:8px}
  .progmeta{display:flex; justify-content:space-between; font-size:.8rem; color:var(--dim); margin-bottom:3px}
  .progbar{height:22px; background:var(--panel2); border:1px solid var(--line); border-radius:11px; overflow:hidden; position:relative}
  .progfill{height:100%; background:linear-gradient(90deg,#1f6feb,#388bfd); transition:width .2s; width:0%}
  .progfill.met{background:linear-gradient(90deg,var(--green2),var(--green))}
  .prognum{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.85rem; text-shadow:0 1px 2px #000a}
  .odds{font-size:.78rem; color:var(--gold); margin-top:6px; text-align:center}

  /* log */
  .logwrap{flex:1; overflow-y:auto; padding:10px 14px 4px}
  .logentry{border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin:9px 0; background:var(--panel); animation:pop .18s ease}
  @keyframes pop{from{opacity:0; transform:translateY(-6px)}to{opacity:1}}
  .logtop{display:flex; align-items:center; gap:9px}
  .lname{font-size:1.2rem; font-weight:800}
  .lrole{font-size:.78rem; color:var(--dim); letter-spacing:.04em}
  .badge{font-size:.72rem; font-weight:800; padding:3px 9px; border-radius:20px; letter-spacing:.06em; margin-left:auto}
  .badge.loyal{background:var(--green2); color:#d7ffe0}
  .badge.mut{background:var(--red2); color:#ffd9da}
  .lstr{font-size:1rem; font-weight:800; margin-left:8px}
  .lstr.pos{color:#8ef0a4} .lstr.zero{color:var(--dim)}
  .lnote{font-size:.92rem; color:var(--gold); margin-top:5px}
  .lnote.bad{color:#ff9ea1}
  .levent{text-align:center; color:var(--dim); font-size:.9rem; padding:8px 13px; border-style:dashed}
  .levent b{color:var(--ink)}

  /* bottom */
  .actions{position:sticky; bottom:0; background:linear-gradient(#0d1117cc,#0d1117); padding:8px 14px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line)}

  /* manifest */
  .manifest-btn{border:1px solid var(--line); background:var(--panel2); border-radius:10px; padding:7px 11px; font-size:.8rem; font-weight:700}
  .overlay{position:fixed; inset:0; background:#000a; z-index:20; display:none}
  .overlay.show{display:block}
  .drawer{position:absolute; top:0; right:0; height:100%; width:min(360px,88%); background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:16px}
  .mrow{display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; margin:6px 0; background:var(--panel2)}
  .mrow .lname{font-size:1rem}
  .dot{width:11px; height:11px; border-radius:50%; flex:none}
  .dot.loyal{background:var(--green)} .dot.mut{background:var(--red)}
  .grp{font-size:.72rem; color:var(--dim); text-transform:uppercase; letter-spacing:.1em; margin:14px 0 2px}

  /* interstitial */
  .full{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 18px}
  .big{font-size:1.5rem; font-weight:800; text-align:center; margin:4px 0 6px}
  .stake{font-size:.95rem; color:var(--dim); text-align:center; margin-bottom:6px}

  .pill{display:inline-block; font-size:.7rem; padding:3px 8px; border-radius:6px; background:var(--panel2); border:1px solid var(--line); margin:2px}
  .seg{display:flex; gap:6px; margin:6px 0}
  .seg button{flex:1; padding:12px 6px; border:1px solid var(--line); border-radius:10px; background:var(--panel2); font-weight:700}
  .seg button.on{background:var(--blue); border-color:var(--blue); color:#fff}
  input[type=text]{width:100%; padding:12px; font-size:1rem; background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--ink)}
  .toggle{display:flex; align-items:center; gap:10px; justify-content:space-between; padding:10px 0}
  table{width:100%; border-collapse:collapse; font-size:.88rem; margin-top:6px}
  td,th{padding:6px 4px; border-bottom:1px solid var(--line); text-align:left}
  td.n,th.n{text-align:right}
  .win{color:#8ef0a4} .loss{color:#ff9ea1}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay" onclick="if(event.target.id==='overlay')toggleManifest(false)">
  <div class="drawer" id="manifest"></div>
</div>

<script>
"use strict";
/* =========================================================================
   MUTINY — solo push-your-luck prototype. Vanilla, self-contained.
   Engine = a small set of functions over one state object (see spec 2.5):
     legTotal (temp int) · plunder (perm int) · crew loyalty (booleans)
     · mutinyPoints (per-leg counter). Nothing else is a tracked running total.
   Console testing: window.MUTINY exposes state + actions.
   ========================================================================= */

/* ---- data: the 18 crew ---- */
const ALL_CREW = [
  ["Briggs","Gunner",3],["Mad Annie","Gunner",2],["Ironside","Gunner",2],
  ["Quill","Navigator",1],["Okonkwo","Navigator",2],["Petrel","Navigator",1],
  ["Whistler","Bosun",2],["Deacon","Bosun",1],["Six-Finger Sal","Bosun",2],
  ["Reyes","Quartermaster",2],["Dutch","Quartermaster",1],["Marisol","Quartermaster",2],
  ["Crowe","Surgeon",1],["Bellamy","Surgeon",2],["Moth","Surgeon",0],
  ["Pip","Deckhand",1],["Cooper","Deckhand",2],["Tides","Deckhand",3],
].map(([name,role,str])=>({name,role,str}));

const LEG_NAMES = ["The Shallows","The Doldrums","The Crossing","The Blockade","Storm Latitudes","Dead Man's Strait"];
const BASE_REQS = [7,9,10,12,13,14];
const DIFFS = {Smuggler:6, Captain:8, "Pirate King":10};
const ROLE_ORDER = ["Gunner","Navigator","Bosun","Quartermaster","Surgeon","Deckhand"];

/* ---- seeded RNG (repeatable shuffles) ---- */
function makeRng(seedStr){
  let h=1779033703^seedStr.length;
  for(let i=0;i<seedStr.length;i++){h=Math.imul(h^seedStr.charCodeAt(i),3432918353); h=h<<13|h>>>19;}
  let a=(h^=h>>>16)>>>0;
  return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function shuffle(arr,rng){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

/* ---- session-persistent instrumentation (in-memory only) ---- */
const SESSION = {games:0, wins:0, losses:{mutiny:0, poor:0}};

/* ---- state ---- */
let S = null;

function newGame(opts){
  const seedStr = (opts.seed && opts.seed.trim()) || ("auto-"+Math.floor(Math.random()*1e9)+"-"+Date.now());
  const rng = makeRng(seedStr);
  const order = shuffle(ALL_CREW.map((_,i)=>i), rng);
  const crew  = order.slice(0,12).map(i=>({...ALL_CREW[i], mutinous:false}));
  const voyage= order.slice(12,18).map(i=>({...ALL_CREW[i]})); // 6 complication cards (role used)
  S = {
    seedStr, rng, crew, voyage,
    plunder:0, target:opts.target, difficulty:opts.difficulty, odds:!!opts.odds,
    legIndex:-1,
    // per-leg (reset each leg)
    requirement:0, legTotal:0, mutinyPoints:0,
    suppressed:false, forcedCall:false, plunderDisabled:false, lashDisabled:false,
    deck:[], revealedMut:[], musterLog:[],
    pending:null, grindLeft:0, grindFail:false, healMode:null, complication:null,
    // game tallies
    lashes:0, confrontations:0, legSummaries:[],
    phase:"legstart", result:null, cause:null,
  };
  beginLeg();
}

/* ---- leg setup ---- */
function beginLeg(){
  S.legIndex++;
  S.legTotal=0; S.mutinyPoints=0; S.suppressed=false; S.forcedCall=false;
  S.plunderDisabled=false; S.lashDisabled=false; S.revealedMut=[]; S.musterLog=[]; S.pending=null;
  S.requirement = BASE_REQS[S.legIndex];
  // complication: reveal the next Voyage card, apply by role
  const c = S.voyage[S.legIndex];
  let txt;
  switch(c.role){
    case "Gunner": case "Navigator": case "Bosun": S.requirement+=2; txt=`Requirement +2 (now ${S.requirement}).`; break;
    case "Deckhand": S.requirement+=1; txt=`Requirement +1 (now ${S.requirement}).`; break;
    case "Quartermaster": S.plunderDisabled=true; txt="No Plunder can be earned this leg."; break;
    case "Surgeon": S.lashDisabled=true; txt="The Lash is disabled this leg."; break;
  }
  S.complication = {role:c.role, name:c.name, txt};
  // shuffle crew deck (loyalty states persist)
  S.deck = shuffle(S.crew.map((_,i)=>i), S.rng);
  S.phase="legstart";
  render();
}

/* ---- helpers ---- */
const cardPoints = c => c.role==="Deckhand" ? 2 : 1;
const isSurgeonHealer = c => c.role==="Surgeon" && c.name!=="Moth";
const loyalCount = () => S.crew.filter(c=>!c.mutinous).length;
const mutCount   = () => S.crew.filter(c=>c.mutinous).length;
function log(e){ S.musterLog.unshift(e); }

/* ---- the muster ---- */
function callCrew(){ S.pending={type:"call"}; S.phase="reveal"; render(); }

function doReveal(){
  const p=S.pending; S.pending=null;
  if(p.type==="face") return faceReveal();
  // CALL: this consumes any forced call
  S.forcedCall=false;
  const idx=S.deck.shift();
  const c=S.crew[idx];
  if(c.mutinous){
    const pts=cardPoints(c);
    S.mutinyPoints+=pts; S.revealedMut.push(idx);
    let note = pts===2 ? "Ringleader — counts as 2 mutiny points." : "+1 mutiny point.";
    let effect="";
    if(!S.suppressed){
      switch(c.role){
        case "Gunner": { const before=S.legTotal; S.legTotal=Math.max(0,S.legTotal-2); effect=`Sabotage: −${before-S.legTotal} strength (now ${S.legTotal}).`; break; }
        case "Navigator": S.requirement+=1; effect=`Sabotage: requirement +1 (now ${S.requirement}).`; break;
        case "Bosun": S.forcedCall=true; effect="Sabotage: next call is FORCED — you cannot stop yet."; break;
        case "Quartermaster": { const before=S.plunder; S.plunder=Math.max(0,S.plunder-1); effect= before>S.plunder?"Sabotage: −1 Plunder.":"Sabotage: −1 Plunder (already 0)."; break; }
        default: break; // Surgeon mutinous: no sabotage
      }
    } else effect="(Sabotage suppressed by Moth.)";
    log({k:"card",name:c.name,role:c.role,loyal:false,str:0, note:note+(effect?" "+effect:""), bad:true});
    if(S.mutinyPoints>=3) return confront();
    return afterCard();
  }
  // LOYAL
  if(!S.lashDisabled){ S.pending={type:"loyalchoice", idx}; S.phase="loyalchoice"; return render(); }
  return acceptLoyal(idx);
}

function acceptLoyal(idx){
  S.pending=null;
  const c=S.crew[idx];
  S.legTotal+=c.str;
  log({k:"card",name:c.name,role:c.role,loyal:true,str:c.str, note:`+${c.str} strength (total ${S.legTotal}).`});
  if(c.name==="Moth"){
    S.suppressed=true;
    log({k:"event",html:`<b>Moth</b> steadies the crew — mutinous sabotage is suppressed for the rest of this leg.`});
    return afterCard();
  }
  if(isSurgeonHealer(c)){
    if(S.revealedMut.length===0){
      log({k:"event",html:`<b>${c.name}</b> (Surgeon) has no revealed mutineer to mend.`});
      return afterCard();
    }
    if(S.revealedMut.length===1) return healMutineer(S.revealedMut[0],"surgeon");
    S.phase="heal"; S.healMode="surgeon"; return render();
  }
  return afterCard();
}

function lash(idx){
  S.pending=null;
  const c=S.crew[idx];
  const add=c.str*2;
  S.legTotal+=add; c.mutinous=true; S.lashes++;
  log({k:"card",name:c.name,role:c.role,loyal:true,str:add, note:`LASHED — ×2 = +${add} strength (total ${S.legTotal}). ${c.name} is now MUTINOUS.`});
  return afterCard();
}

function healMutineer(idx,mode){
  const c=S.crew[idx];
  c.mutinous=false;
  S.revealedMut=S.revealedMut.filter(i=>i!==idx);
  S.mutinyPoints=Math.max(0,S.mutinyPoints-cardPoints(c));
  log({k:"event",html:`<b>${c.name}</b> is brought back to the fold — Loyal again. Mutiny points now ${S.mutinyPoints}.`});
  if(mode==="surgeon") return afterCard();
  return endMuster("faced");
}

function afterCard(){
  S.pending=null;
  if(S.deck.length===0) return endMuster("empty");
  S.phase="muster"; render();
}

/* STOP & BANK */
function stopBank(){
  if(S.legTotal<S.requirement || S.forcedCall) return;
  endMuster("stop");
}

/* ---- mutiny confrontation (3+ points) ---- */
function confront(){ S.confrontations++; S.phase="mutiny"; render(); }
function quell(){
  if(S.plunder<1) return;
  S.plunder-=1;
  log({k:"event",html:`You pay <b>1 Plunder</b> to quell the mutiny. The muster ends.`});
  endMuster("quell");
}
function faceThemDown(){ S.pending={type:"face"}; S.phase="reveal"; render(); }
function faceReveal(){
  if(S.deck.length===0){ return gameOver(); }
  const idx=S.deck.shift(); const c=S.crew[idx];
  if(c.mutinous){
    log({k:"card",name:c.name,role:c.role,loyal:false,str:0,note:"They face you down — and they are MUTINOUS.",bad:true});
    return gameOver();
  }
  log({k:"card",name:c.name,role:c.role,loyal:true,str:0,note:"Order restored — this card is spent (no strength)."});
  if(S.revealedMut.length===0) return endMuster("faced");
  if(S.revealedMut.length===1) return healMutineer(S.revealedMut[0],"face");
  S.phase="heal"; S.healMode="face"; render();
}

/* ---- resolve leg ---- */
function endMuster(reason){
  const success = S.legTotal>=S.requirement;
  let surplus=0;
  if(success && !S.plunderDisabled){
    surplus=Math.min(3, S.legTotal-S.requirement);
    S.plunder+=surplus;
  }
  log({k:"event",html: success
      ? `<b>LEG CLEARED</b> — ${S.legTotal} vs ${S.requirement}. ${S.plunderDisabled?"No Plunder (Quartermaster complication).":`Banked +${surplus} Plunder${S.legTotal-S.requirement>3?" (capped)":""}.`}`
      : `<b>LEG FAILED</b> — ${S.legTotal} vs ${S.requirement}. No Plunder.`});
  S.legSummaries.push({leg:S.legIndex+1, name:LEG_NAMES[S.legIndex], req:S.requirement, total:S.legTotal, success, surplus, plunder:S.plunder, reason});
  S.grindFail=!success;
  S.grindLeft=success?1:2;
  startGrind();
}

/* ---- the Grind: choose Loyal crew to flip Mutinous ---- */
function startGrind(){
  if(S.grindLeft<=0 || loyalCount()===0) return afterGrind();
  S.phase="grind"; render();
}
function grindPick(idx){
  S.crew[idx].mutinous=true; S.grindLeft--;
  if(S.grindLeft<=0 || loyalCount()===0) return afterGrind();
  render();
}
function afterGrind(){
  if(S.legIndex>=5) return endGame();
  S.phase="shore"; render();
}

/* ---- shore leave ---- */
function shorePick(idx){
  if(S.plunder<1) return;
  S.plunder-=1; S.crew[idx].mutinous=false; render();
}
function setSail(){ beginLeg(); }

/* ---- end ---- */
function gameOver(){ finishGame("loss","mutiny"); }
function endGame(){ const win=S.plunder>=S.target; finishGame(win?"win":"loss", win?null:"poor"); }
function finishGame(result,cause){
  S.result=result; S.cause=cause; S.phase="end";
  SESSION.games++;
  if(result==="win") SESSION.wins++;
  else if(cause==="mutiny") SESSION.losses.mutiny++;
  else SESSION.losses.poor++;
  render();
}

/* =========================== RENDER =========================== */
const app=document.getElementById("app");

function render(){
  if(!S){ return renderStart(); }
  switch(S.phase){
    case "legstart": return renderLegStart();
    case "muster": case "reveal": case "loyalchoice": case "mutiny": case "heal":
      return renderPlay();
    case "grind": return renderGrind();
    case "shore": return renderShore();
    case "end": return renderEnd();
    default: return renderStart();
  }
}

/* ---- start screen ---- */
let startOpts={difficulty:"Captain", odds:false, seed:""};
function renderStart(){
  app.innerHTML = `
  <div class="wrap">
    <div class="center" style="margin:18px 0 6px">
      <h1>⚓ MUTINY</h1>
      <div class="muted">A solo push-your-luck voyage · playtest prototype</div>
    </div>
    <div class="card">
      <h3>Difficulty (win target)</h3>
      <div class="seg" id="diffseg">
        ${Object.entries(DIFFS).map(([k,v])=>`<button class="${startOpts.difficulty===k?'on':''}" onclick="setDiff('${k}')">${k}<br><small>${v}</small></button>`).join("")}
      </div>
      <div class="toggle">
        <div><b>Show odds</b><br><small class="muted">mutineers / cards left, during muster</small></div>
        <button class="btn sm" style="width:auto;margin:0" onclick="startOpts.odds=!startOpts.odds;render()">${startOpts.odds?"ON":"OFF"}</button>
      </div>
      <h3 style="margin-top:14px">Seed <small class="muted">(optional, repeatable shuffles)</small></h3>
      <input type="text" id="seedin" placeholder="leave blank for random" value="${startOpts.seed}" oninput="startOpts.seed=this.value">
    </div>
    <button class="btn primary" onclick="startGame()">SET SAIL</button>
    ${SESSION.games?`<div class="card center"><b>Session:</b> ${SESSION.games} played · <span class="win">${SESSION.wins}W</span> / <span class="loss">${SESSION.losses.mutiny+SESSION.losses.poor}L</span> &nbsp; <small class="muted">(mutiny ${SESSION.losses.mutiny} · poor ${SESSION.losses.poor})</small></div>`:""}
    <div class="card muted" style="font-size:.85rem">
      Reveal crew one at a time to meet each leg's strength. Bank surplus as Plunder; stop once the requirement is met. Mutineers persist in your deck — 3 mutiny points in a leg forces a confrontation. Survive 6 legs and finish rich.
    </div>
  </div>`;
}
function setDiff(k){ startOpts.difficulty=k; render(); }
function startGame(){
  newGame({difficulty:startOpts.difficulty, target:DIFFS[startOpts.difficulty], odds:startOpts.odds, seed:startOpts.seed});
}

/* ---- top bar (shared) ---- */
function topbar(){
  const pct=Math.min(100, Math.round(S.legTotal/S.requirement*100));
  const met=S.legTotal>=S.requirement;
  let oddsHtml="";
  if(S.odds && (S.phase==="muster"||S.phase==="reveal"||S.phase==="loyalchoice"||S.phase==="mutiny"||S.phase==="heal")){
    const mr=S.deck.filter(i=>S.crew[i].mutinous).length;
    oddsHtml=`<div class="odds">odds: ${mr} mutinous / ${S.deck.length} cards left in deck</div>`;
  }
  return `
  <div class="topbar">
    <div class="topline">
      <div>
        <div class="legname">${LEG_NAMES[S.legIndex]}</div>
        <div class="legno">LEG ${S.legIndex+1} / 6 · ${S.difficulty}</div>
      </div>
      <div class="stats">
        <div class="stat"><b style="color:var(--gold)">${S.plunder}</b><span>Plunder</span></div>
        <div class="stat"><b>${S.target}</b><span>Target</span></div>
        <button class="manifest-btn" onclick="toggleManifest(true)">CREW ☰</button>
      </div>
    </div>
    <div class="progwrap">
      <div class="progmeta"><span>Strength</span><span>Mutiny ${S.mutinyPoints}/3</span></div>
      <div class="progbar"><div class="progfill ${met?'met':''}" style="width:${pct}%"></div>
        <div class="prognum">${S.legTotal} / ${S.requirement}${met?" ✓":""}</div></div>
    </div>
    ${oddsHtml}
  </div>`;
}

/* ---- leg start (complication reveal) ---- */
function renderLegStart(){
  const c=S.complication;
  app.innerHTML = topbar() + `
  <div class="full">
    <div class="center"><div class="legno">COMPLICATION</div></div>
    <div class="card center">
      <div class="lname">${c.name}</div>
      <div class="lrole">${c.role}</div>
      <div style="margin-top:10px; font-size:1.05rem">${c.txt}</div>
    </div>
    <div class="stake">Base requirement was ${BASE_REQS[S.legIndex]}. Meet <b>${S.requirement}</b> strength to clear the leg.</div>
  </div>
  <div class="actions"><button class="btn primary" onclick="S.phase='muster';render()">BEGIN MUSTER</button></div>`;
}

/* ---- main play (muster / reveal beat / loyal choice / mutiny / heal) ---- */
function renderPlay(){
  let body = `<div class="logwrap" id="logwrap">${renderLog()}</div>`;
  let actions="";

  if(S.phase==="reveal"){
    body = `<div class="full center">
      <div class="legno">${S.pending.type==="face"?"FACE THEM DOWN":"THE NEXT OF THE CREW"}</div>
      <div class="big">🂠</div>
      <div class="stake">They wait on your call.</div></div>`;
    actions = `<button class="btn primary" onclick="doReveal()">Reveal their answer…</button>`;
  }
  else if(S.phase==="loyalchoice"){
    const c=S.crew[S.pending.idx];
    const special = c.name==="Moth" ? " (lashing forgoes Moth's calming)" :
                    isSurgeonHealer(c) ? " (lashing forgoes their mending)" : "";
    actions = `
      <div class="stake"><b>${c.name}</b> answers Loyal — strength ${c.str}.</div>
      <div class="row">
        <button class="btn primary grow" onclick="acceptLoyal(${S.pending.idx})">ACCEPT +${c.str}</button>
        <button class="btn gold grow" onclick="lash(${S.pending.idx})">LASH ×2 → +${c.str*2}</button>
      </div>
      <div class="center muted" style="font-size:.78rem">Lash flips ${c.name} to Mutinous, permanently${special}.</div>`;
  }
  else if(S.phase==="mutiny"){
    return renderMutiny();
  }
  else if(S.phase==="heal"){
    return renderHeal();
  }
  else { // muster
    const met=S.legTotal>=S.requirement;
    const canStop = met && !S.forcedCall;
    const surplus = S.plunderDisabled?0:Math.min(3, Math.max(0,S.legTotal-S.requirement));
    actions = `
      <button class="btn primary" onclick="callCrew()">CALL CREW${S.forcedCall?" (forced)":""}</button>
      <button class="btn" onclick="stopBank()" ${canStop?"":"disabled"}>STOP & BANK${canStop?` (+${surplus} Plunder)`:S.forcedCall?" — forced call pending":" — need "+S.requirement}</button>`;
  }
  app.innerHTML = topbar() + body + `<div class="actions">${actions}</div>`;
  const lw=document.getElementById("logwrap"); if(lw) lw.scrollTop=0;
}

function renderLog(){
  if(!S.musterLog.length) return `<div class="center muted" style="margin-top:20px">Call the crew to begin the muster.</div>`;
  return S.musterLog.map(e=>{
    if(e.k==="event") return `<div class="logentry levent">${e.html}</div>`;
    const strcls = e.str>0?"pos":"zero";
    return `<div class="logentry">
      <div class="logtop">
        <span class="lname">${e.name}</span>
        <span class="lrole">${e.role}</span>
        <span class="badge ${e.loyal?'loyal':'mut'}">${e.loyal?'LOYAL':'MUTINOUS'}</span>
        <span class="lstr ${strcls}">${e.loyal?`+${e.str}`:'+0'}</span>
      </div>
      ${e.note?`<div class="lnote ${e.bad?'bad':''}">${e.note}</div>`:""}
    </div>`;
  }).join("");
}

function renderMutiny(){
  const canQuell=S.plunder>=1;
  app.innerHTML = topbar() + `
  <div class="full">
    <div class="center"><div class="big" style="color:var(--red)">⚔️ MUTINY!</div>
    <div class="stake">${S.mutinyPoints} mutiny points. The crew turns on you.</div></div>
    <button class="btn ${canQuell?'':'ghost'}" onclick="quell()" ${canQuell?'':'disabled'}>
      QUELL — pay 1 Plunder${canQuell?'':' (you have none)'}<br><small style="font-weight:400;color:var(--dim)">Muster ends now; leg resolves on ${S.legTotal}.</small></button>
    <button class="btn danger" onclick="faceThemDown()">FACE THEM DOWN<br><small style="font-weight:400;color:#ffd9da">Reveal one card. Loyal → order restored. Mutinous (or empty deck) → they take the ship.</small></button>
  </div>`;
}

function renderHeal(){
  const opts=S.revealedMut.map(idx=>{const c=S.crew[idx];
    return `<button class="btn sm" onclick="healMutineer(${idx},'${S.healMode}')">${c.name} <span class="lrole">${c.role}</span> <span class="badge mut" style="margin-left:auto">${cardPoints(c)} pt</span></button>`;}).join("");
  app.innerHTML = topbar() + `
  <div class="full">
    <div class="center"><div class="big">🩹 Mend a mutineer</div>
    <div class="stake">${S.healMode==='surgeon'?'The surgeon':'Order restored — you'} may flip one revealed mutineer back to Loyal.</div></div>
    ${opts}
  </div>`;
}

/* ---- grind ---- */
function renderGrind(){
  const loyals=S.crew.map((c,i)=>({c,i})).filter(o=>!o.c.mutinous);
  const opts=loyals.map(o=>`<button class="btn sm" onclick="grindPick(${o.i})">${o.c.name} <span class="lrole">${o.c.role} · str ${o.c.str}</span></button>`).join("");
  app.innerHTML = topbar() + `
  <div class="full">
    <div class="center"><div class="big">⛓️ The Grind</div>
    <div class="stake">${S.grindFail?"Leg failed — ":""}Someone takes the blame. Choose <b>${S.grindLeft}</b> more Loyal crew to flip Mutinous.</div></div>
    ${opts||'<div class="center muted">No Loyal crew remain to blame.</div>'}
  </div>`;
}

/* ---- shore leave ---- */
function renderShore(){
  const muts=S.crew.map((c,i)=>({c,i})).filter(o=>o.c.mutinous);
  const opts=muts.map(o=>`<button class="btn sm" onclick="shorePick(${o.i})" ${S.plunder<1?'disabled':''}>Pardon ${o.c.name} <span class="lrole">${o.c.role}</span> <span style="margin-left:auto;color:var(--gold)">−1 Plunder</span></button>`).join("");
  app.innerHTML = topbar() + `
  <div class="logwrap">
    <div class="center" style="margin:8px 0"><div class="big">🏝️ Shore Leave</div>
    <div class="stake">Spend 1 Plunder per sailor to pardon mutineers before the next leg. You have <b style="color:var(--gold)">${S.plunder}</b> Plunder.</div></div>
    ${muts.length?opts:'<div class="center muted">No mutineers aboard. A loyal crew.</div>'}
  </div>
  <div class="actions"><button class="btn primary" onclick="setSail()">SET SAIL → Leg ${S.legIndex+2}</button></div>`;
}

/* ---- end ---- */
function renderEnd(){
  const win=S.result==="win";
  const headline = win ? "🏆 VICTORY" : S.cause==="mutiny" ? "☠️ THE CREW TAKES THE SHIP" : "🪦 DIED POOR";
  const sub = win ? `You finished with ${S.plunder} Plunder — target ${S.target} met.`
            : S.cause==="mutiny" ? `Mutiny on leg ${S.legIndex+1}. They face you down and you fall.`
            : `Voyage survived, but only ${S.plunder} Plunder — short of ${S.target}.`;
  const rows=S.legSummaries.map(s=>`<tr>
      <td>${s.leg}. ${s.name}</td>
      <td class="n">${s.total}/${s.req}</td>
      <td class="n ${s.success?'win':'loss'}">${s.success?`+${s.surplus}`:'fail'}</td>
      <td class="n">${s.plunder}</td></tr>`).join("");
  app.innerHTML = `
  <div class="wrap">
    <div class="center" style="margin:14px 0">
      <h1 class="${win?'win':'loss'}">${headline}</h1>
      <div class="muted">${sub}</div>
    </div>
    <div class="card">
      <div class="row" style="flex-wrap:wrap; gap:6px">
        <span class="pill">Score: <b>${S.plunder}</b></span>
        <span class="pill">Mutineers: <b>${mutCount()}</b>/12</span>
        <span class="pill">Confrontations: <b>${S.confrontations}</b></span>
        <span class="pill">Lashes: <b>${S.lashes}</b></span>
        <span class="pill">Seed: <b>${S.seedStr.length>18?S.seedStr.slice(0,18)+'…':S.seedStr}</b></span>
      </div>
      <table><thead><tr><th>Leg</th><th class="n">Total</th><th class="n">Plun+</th><th class="n">Bank</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div class="card center">
      <b>Session:</b> ${SESSION.games} played · <span class="win">${SESSION.wins}W</span> / <span class="loss">${SESSION.losses.mutiny+SESSION.losses.poor}L</span>
      <br><small class="muted">losses — mutiny ${SESSION.losses.mutiny} · died poor ${SESSION.losses.poor}</small>
    </div>
    <button class="btn primary" id="newvoy">NEW VOYAGE</button>
  </div>`;
  document.getElementById("newvoy").onclick=()=>{ S=null; render(); };
}

/* ---- manifest drawer ---- */
function toggleManifest(show){
  const ov=document.getElementById("overlay");
  if(show){ buildManifest(); ov.classList.add("show"); } else ov.classList.remove("show");
}
function buildManifest(){
  const m=document.getElementById("manifest");
  let html=`<div class="row"><h2 class="grow" style="margin:0">Crew Manifest</h2><button class="manifest-btn" onclick="toggleManifest(false)">✕</button></div>
    <div class="muted" style="font-size:.85rem">${loyalCount()} loyal · ${mutCount()} mutinous · ${S.deck.length?S.deck.length+" still in deck this leg":"deck spent"}</div>`;
  ROLE_ORDER.forEach(role=>{
    const grp=S.crew.map((c,i)=>({c,i})).filter(o=>o.c.role===role);
    if(!grp.length) return;
    html+=`<div class="grp">${role}</div>`;
    grp.forEach(o=>{
      const inDeck=S.deck.includes(o.i);
      html+=`<div class="mrow">
        <span class="dot ${o.c.mutinous?'mut':'loyal'}"></span>
        <span class="lname">${o.c.name}</span>
        <span class="lrole">str ${o.c.str}</span>
        <span class="badge ${o.c.mutinous?'mut':'loyal'}" style="margin-left:auto">${o.c.mutinous?'MUTINOUS':'LOYAL'}</span>
        ${inDeck?'':'<span class="lrole" style="margin-left:4px">·seen</span>'}
      </div>`;
    });
  });
  m.innerHTML=html;
}

/* ---- console testing handle ---- */
window.MUTINY = {get S(){return S;}, newGame, callCrew, doReveal, acceptLoyal, lash, stopBank, quell, faceThemDown, healMutineer, grindPick, shorePick, setSail, SESSION};

render();
</script>
</body>
</html>
